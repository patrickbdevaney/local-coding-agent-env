[package]
name = "lca-fetch"
version = "0.1.0"
edition = "2021"
description = "Concurrent fetch, text extraction, and link harvest for the subst research lane."

[dependencies]
ureq = { version = "2", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
